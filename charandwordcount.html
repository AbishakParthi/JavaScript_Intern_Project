<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }
        body {
            display: flex;
            justify-content: center;
            background-color: black;
        }
        .sec {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            width: 500px;
            background-color: hsl(202, 100%, 50%);
            padding: 20px;
            border-radius: 10px;
        }
        textarea {
            width: 300px;
            max-width: 500px;
            height: 200px;
            border: none;
            outline: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 16px;
            resize: none;
            color: black;
        }
        textarea:focus {
            border: 2px solid rgb(2, 255, 2);
        }
        h1, h2 {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <section class="sec">
        <textarea id="ta" placeholder="Type here something..."></textarea>
        <h1>Character(s): 0</h1>
        <h2>Word(s): 0</h2>
    </section>
    <script>
        document.querySelector("textarea").addEventListener("input", _ => {
            document.querySelector("h1").textContent = "Character(s): " + document.querySelector("textarea").value.length
            document.querySelector("textarea").value.length === 0 ? document.querySelector("h2").textContent = "Word(s): " + 0 : document.querySelector("h2").textContent = "Word(s): " + document.querySelector("textarea").value.trim().split(" ").length
        })
    </script>
</body>

</html>
