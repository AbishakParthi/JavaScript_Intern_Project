<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color: white;
        }

        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .sec {
            width: 400px;
            margin: auto;
            padding: 20px;
            background-color: hsl(200, 100%, 50%);
            box-shadow: 0 0 20px white;
            border-radius: 10px;
            text-align: center;
            transform: scale(1.3);
        }

        h1 {
            margin-bottom: 20px;
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 10px 0;
            border: none;
            outline: none;
            border-radius: 20px;
            color: black;
        }

        input:focus {
            border: 2px solid violet;
        }

        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: 1s;
        }

        button:hover {
            background-color: #218838;
        }

        #result {
            margin-top: 10px;
        }

        #res {
            border: 2px dotted lawngreen;
            border-radius: 10px;
            display: none;
            padding: 10px;
            margin-top: 10px;
        }

        #cat {
            font-size: 22px;
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <section class="sec">
        <h1>BMI Calculator</h1>
        <label for="weight">Weight (kg):</label>
        <input type="number" id="weight" placeholder="Enter weight in kg"><br><br>
        <label for="height">Height (cm):</label>
        <input type="number" id="height" placeholder="Enter height in cm"><br><br>
        <button onclick="calculateBMI()">Calculate BMI</button>
        <div id="res">
            <h2 id="result"></h2>
            <p id="cat"></p>
        </div>
        <h2 id="err"></h2>
    </section>
    <script>
        function calculateBMI() {
            const weight = parseFloat(document.getElementById('weight').value);
            const heightCm = parseFloat(document.getElementById('height').value);
            const p = document.getElementById("cat")
            const res = document.getElementById("res")
            const err = document.getElementById("err")
            const heightM = heightCm / 100;

            if (weight > 0 && heightM > 0) {
                err.innerText = ""
                res.style.display = "block"
                const bmi = weight / (heightM * heightM);
                document.getElementById('result').innerText = `Your BMI is: ${bmi.toFixed(2)}`;
                if (bmi.toFixed(1) <= 18.5) {
                    p.textContent = "Status: Underweight"
                    p.style.backgroundColor = "hsl(210, 100%, 50%)"
                }
                else if (bmi.toFixed(1) >= 18.5 && bmi.toFixed(1) <= 24.9) {
                    p.textContent = "Status: Normal (Healthy weight)"
                    p.style.backgroundColor = "#28a745"
                }
                else if (bmi.toFixed(1) >= 25.0 && bmi.toFixed(1) <= 29.9) {
                    p.textContent = "Status: Overweight"
                    p.style.backgroundColor = "hsl(50, 100%, 45%)"
                }
                else if (bmi.toFixed(1) >= 30.0 && bmi.toFixed(1) <= 34.9) {
                    p.textContent = "Status: Obesity Class I"
                    p.style.backgroundColor = "orange"
                }
                else if (bmi.toFixed(1) >= 35.0 && bmi.toFixed(1) <= 39.9) {
                    p.textContent = "Status: Obesity Class II"
                    p.style.backgroundColor = "red"
                }
                else if (bmi.toFixed(1) >= 40.0) {
                    p.textContent = "Status: Obesity Class III (Severe / Morbid obesity)"
                    p.style.backgroundColor = "purple"
                }
            } else {
                err.innerText = 'Please enter valid weight and height!';
                err.style.color = "red"
            }
        }
    </script>
</body>

</html>
