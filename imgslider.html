    <script>
        const images = ["i1", "i2", "i3", "i4", "i5"];
        let current = 0;

        const prev = document.getElementById("pre");
        const next = document.getElementById("nxt");

        function showImage(index, direction) {
            images.forEach(id => {
                const el = document.getElementById(id);
                el.style.transition = "0.3s";
                el.style.transform = `translateX(${direction * 300}%)`;
            });

            setTimeout(() => {
                images.forEach(id => {
                    document.getElementById(id).style.display = "none";
                });

                const currentImg = document.getElementById(images[index]);
                currentImg.style.display = "block";
                currentImg.style.transform = `translateX(${-direction * 300}%)`;

                setTimeout(() => {
                    currentImg.style.transform = "translateX(0%)";
                }, 20);
            }, 300);
        }

        prev.onclick = () => {
            current--;
            if (current < 0) current = images.length - 1;
            showImage(current, -1); // slide RIGHT → LEFT
        };

        next.onclick = () => {
            current++;
            if (current >= images.length) current = 0;
            showImage(current, 1); // slide LEFT → RIGHT
        };
    </script>
